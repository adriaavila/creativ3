<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="allok">
  <!-- El ícono de allok, del sistema de diseño (src/styles/allok/tokens.json):
       la loseta de app en Ink con radio 23,4 % (30 sobre 128), y el símbolo
       de MarkSvg (src/components/ak/Brand.tsx) en Cloud: el círculo abierto
       abajo a la derecha, trazo 12 sobre su rejilla de 80, y el punto que lo
       cierra en Electric Blue, como el punto de un resultado. -->
  <rect width="128" height="128" rx="30" fill="#0B0D0E"/>
  <g transform="translate(13.2 13.2) scale(1.27)">
    <path d="M63.909 42.092A24 24 0 1 0 42.092 63.909" fill="none" stroke="#F7F8F8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="56.971" cy="56.971" r="6" fill="#315CFF"/>
  </g>
</svg>
